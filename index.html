<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Receipt Extractor</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f5f7fb;

    color: #222;
}


.container {

    max-width: 1100px;

    margin: 40px auto;

    padding: 0 20px;

}


h1 {

    text-align: center;

    margin-bottom: 10px;

}


.subtitle {

    text-align: center;

    color: #666;

    margin-bottom: 30px;

}


.upload-box {

    background: white;

    border-radius: 12px;

    padding: 25px;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.08);

    margin-bottom: 25px;

}


input[type="file"] {

    width: 100%;

    padding: 15px;

    border: 2px dashed #bbb;

    border-radius: 8px;

    background: #fafafa;

}


.buttons {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 15px;

}


button {

    border: none;

    border-radius: 7px;

    padding: 11px 18px;

    cursor: pointer;

    font-size: 14px;

}


#extractBtn {

    background: #2563eb;

    color: white;

}


#saveBtn {

    background: #16a34a;

    color: white;

}


#copyBtn {

    background: #7c3aed;

    color: white;

}


#downloadBtn {

    background: #ea580c;

    color: white;

}


#clearBtn {

    background: #dc2626;

    color: white;

}


button:disabled {

    opacity: 0.5;

    cursor: not-allowed;

}


.status {

    margin-top: 15px;

    padding: 12px;

    border-radius: 7px;

    background: #f1f5f9;

    white-space: pre-wrap;

}


.results {

    margin-top: 25px;

}


.card {

    background: white;

    border-radius: 12px;

    padding: 20px;

    margin-bottom: 15px;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.07);

}


.card-header {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 15px;

    font-weight: bold;

}


.field {

    margin-bottom: 10px;

}


.label {

    color: #777;

    font-size: 12px;

    text-transform: uppercase;

    margin-bottom: 3px;

}


.value {

    font-size: 16px;

    font-weight: 500;

}


.autocount {

    margin-top: 15px;

    padding: 13px;

    background: #f8fafc;

    border-radius: 7px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 14px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

}


.autocount-text {

    flex: 1;

}


.autocount-price {

    font-weight: bold;

    white-space: nowrap;

}


.success {

    color: #15803d;

}


.error {

    color: #dc2626;

}


.processing {

    color: #b45309;

}


.hidden {

    display: none;

}

</style>

</head>


<body>


<div class="container">


<h1>Receipt Extractor</h1>


<div class="subtitle">
    Upload receipts or invoices and extract accounting information automatically.
</div>


<div class="upload-box">


<input
    type="file"
    id="fileInput"
    accept="image/*"
    multiple
>


<div class="buttons">

<button id="extractBtn">
    Extract Receipts
</button>

<button id="saveBtn" disabled>
    Save to Google Sheets
</button>

<button id="copyBtn" disabled>
    Copy AutoCount
</button>

<button id="downloadBtn" disabled>
    Download CSV
</button>

<button id="clearBtn">
    Clear
</button>

</div>


<div
    id="status"
    class="status hidden">
</div>


</div>


<div
    id="results"
    class="results">
</div>


</div>


<script>


/* =========================================================
   SETTINGS
   ========================================================= */

const APPS_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbxGYlLkkvFXLxtLTjJMn7DVpPLQR4QASmR7W9ZKlr150muzI5ywiNictWe15jrYohC9ww/exec';


const BATCH_SIZE = 10;

const MAX_IMAGE_SIZE = 1200;

const JPEG_QUALITY = 0.70;

const MAX_RETRIES = 3;

const DELAY_BETWEEN_BATCHES = 3000;


/* =========================================================
   VARIABLES
   ========================================================= */

let extractedResults = [];


/* =========================================================
   ELEMENTS
   ========================================================= */

const fileInput =
    document.getElementById('fileInput');

const extractBtn =
    document.getElementById('extractBtn');

const saveBtn =
    document.getElementById('saveBtn');

const copyBtn =
    document.getElementById('copyBtn');

const downloadBtn =
    document.getElementById('downloadBtn');

const clearBtn =
    document.getElementById('clearBtn');

const status =
    document.getElementById('status');

const resultsContainer =
    document.getElementById('results');


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(message, type = '') {

    status.classList.remove('hidden');

    status.className =
        'status ' + type;

    status.textContent = message;

}


function sleep(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );

}


/* =========================================================
   IMAGE COMPRESSION
   ========================================================= */

function compressImage(file) {

    return new Promise((resolve, reject) => {

        const reader =
            new FileReader();


        reader.onload = function(event) {

            const img =
                new Image();


            img.onload = function() {

                let width = img.width;

                let height = img.height;


                if (
                    width > MAX_IMAGE_SIZE ||
                    height > MAX_IMAGE_SIZE
                ) {

                    const scale =
                        Math.min(
                            MAX_IMAGE_SIZE / width,
                            MAX_IMAGE_SIZE / height
                        );

                    width =
                        Math.round(width * scale);

                    height =
                        Math.round(height * scale);

                }


                const canvas =
                    document.createElement('canvas');


                canvas.width = width;

                canvas.height = height;


                const ctx =
                    canvas.getContext('2d');


                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                const dataUrl =
                    canvas.toDataURL(
                        'image/jpeg',
                        JPEG_QUALITY
                    );


                const base64 =
                    dataUrl.split(',')[1];


                resolve({

                    base64: base64,

                    mimeType: 'image/jpeg',

                    filename: file.name

                });

            };


            img.onerror = function() {

                reject(
                    new Error(
                        'Unable to read image: ' +
                        file.name
                    )
                );

            };


            img.src =
                event.target.result;

        };


        reader.onerror = function() {

            reject(
                new Error(
                    'Unable to load file: ' +
                    file.name
                )
            );

        };


        reader.readAsDataURL(file);

    });

}


/* =========================================================
   SEND BATCH TO APPS SCRIPT
   ========================================================= */

async function sendBatch(batch) {

    let lastError;


    for (
        let attempt = 1;
        attempt <= MAX_RETRIES;
        attempt++
    ) {

        try {

            const response =
                await fetch(
                    APPS_SCRIPT_URL,
                    {

                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'text/plain;charset=utf-8'
                        },

                        body: JSON.stringify({

                            action: 'extract',

                            receipts: batch.map(
                                item => ({
                                    base64:
                                        item.base64,

                                    mimeType:
                                        item.mimeType
                                })
                            )

                        })

                    }
                );


            const text =
                await response.text();


            let data;


            try {

                data =
                    JSON.parse(text);

            } catch (error) {

                throw new Error(
                    'INVALID SERVER RESPONSE: ' +
                    text.substring(0, 300)
                );

            }


            if (!data.success) {

                throw new Error(
                    data.error ||
                    'EXTRACTION FAILED.'
                );

            }


            if (
                !Array.isArray(data.results)
            ) {

                throw new Error(
                    'SERVER RETURNED INVALID RESULTS.'
                );

            }


            return data.results;


        } catch (error) {

            lastError = error;


            if (
                attempt < MAX_RETRIES
            ) {

                showStatus(
                    'Batch failed. Retrying ' +
                    attempt +
                    '/' +
                    MAX_RETRIES +
                    '...'
                );


                await sleep(
                    2000 * attempt
                );

            }

        }

    }


    throw lastError;

}


/* =========================================================
   EXTRACT RECEIPTS
   ========================================================= */

extractBtn.addEventListener(
    'click',
    async function() {

        const files =
            Array.from(
                fileInput.files
            );


        if (files.length === 0) {

            showStatus(
                'Please select at least one receipt or invoice.',
                'error'
            );

            return;

        }


        extractBtn.disabled = true;

        saveBtn.disabled = true;

        copyBtn.disabled = true;

        downloadBtn.disabled = true;


        extractedResults = [];

        resultsContainer.innerHTML = '';


        try {

            showStatus(
                'Preparing ' +
                files.length +
                ' receipt(s)...',
                'processing'
            );


            const prepared = [];


            for (
                let i = 0;
                i < files.length;
                i++
            ) {

                showStatus(
                    'Preparing image ' +
                    (i + 1) +
                    ' of ' +
                    files.length +
                    '...'
                );


                const compressed =
                    await compressImage(
                        files[i]
                    );


                prepared.push(
                    compressed
                );

            }


            const totalBatches =
                Math.ceil(
                    prepared.length /
                    BATCH_SIZE
                );


            for (
                let i = 0;
                i < prepared.length;
                i += BATCH_SIZE
            ) {

                const batch =
                    prepared.slice(
                        i,
                        i + BATCH_SIZE
                    );


                const batchNumber =
                    Math.floor(
                        i / BATCH_SIZE
                    ) + 1;


                showStatus(
                    'Processing batch ' +
                    batchNumber +
                    ' of ' +
                    totalBatches +
                    ' (' +
                    batch.length +
                    ' receipts)...',
                    'processing'
                );


                const results =
                    await sendBatch(
                        batch
                    );


                results.forEach(
                    (result, index) => {

                        extractedResults.push({

                            success: true,

                            filename:
                                batch[index]
                                    .filename,

                            company:
                                result.company || '',

                            item:
                                result.item || '',

                            date:
                                result.date || '',

                            price:
                                result.price || '',

                            transactionType:
                                result.transactionType || '',

                            autocount:
                                result.autocount || ''

                        });

                    }
                );


                if (
                    i + BATCH_SIZE <
                    prepared.length
                ) {

                    await sleep(
                        DELAY_BETWEEN_BATCHES
                    );

                }

            }


            renderResults();


            saveBtn.disabled =
                extractedResults.length === 0;

            copyBtn.disabled =
                extractedResults.length === 0;

            downloadBtn.disabled =
                extractedResults.length === 0;


            showStatus(
                'Completed. ' +
                extractedResults.length +
                ' receipt(s) extracted successfully.',
                'success'
            );


        } catch (error) {

            console.error(error);


            showStatus(
                'ERROR: ' +
                error.message,
                'error'
            );

        } finally {

            extractBtn.disabled = false;

        }

    }
);


/* =========================================================
   RENDER RESULTS
   ========================================================= */

function renderResults() {

    resultsContainer.innerHTML = '';


    extractedResults.forEach(
        (record, index) => {

            const card =
                document.createElement('div');


            card.className = 'card';


            const autocount =
                record.autocount ||
                (
                    'BEING ' +
                    (
                        record.transactionType ||
                        'TRANSACTION'
                    ) +
                    ' OF ' +
                    (
                        record.item ||
                        ''
                    ) +
                    ' - ' +
                    (
                        record.company ||
                        ''
                    ) +
                    ' - ' +
                    (
                        record.date ||
                        ''
                    )
                );


            card.innerHTML = `

                <div class="card-header">

                    <span>
                        Receipt ${index + 1}
                    </span>

                    <span>
                        ${escapeHtml(record.filename)}
                    </span>

                </div>


                <div class="field">

                    <div class="label">
                        Company
                    </div>

                    <div class="value">
                        ${escapeHtml(record.company)}
                    </div>

                </div>


                <div class="field">

                    <div class="label">
                        Item
                    </div>

                    <div class="value">
                        ${escapeHtml(record.item)}
                    </div>

                </div>


                <div class="field">

                    <div class="label">
                        Transaction Type
                    </div>

                    <div class="value">
                        ${escapeHtml(
                            record.transactionType
                        )}
                    </div>

                </div>


                <div class="field">

                    <div class="label">
                        Date
                    </div>

                    <div class="value">
                        ${escapeHtml(record.date)}
                    </div>

                </div>


                <div class="field">

                    <div class="label">
                        Price
                    </div>

                    <div class="value">
                        RM ${escapeHtml(record.price)}
                    </div>

                </div>


                <div class="autocount">

                    <div class="autocount-text">

                        ${escapeHtml(autocount)}

                    </div>


                    <div class="autocount-price">

                        RM ${escapeHtml(record.price)}

                    </div>

                </div>

            `;


            resultsContainer.appendChild(card);

        }
    );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    return String(value || '')

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}


/* =========================================================
   SAVE TO GOOGLE SHEETS
   ========================================================= */

saveBtn.addEventListener(
    'click',
    async function() {

        if (
            extractedResults.length === 0
        ) {

            return;

        }


        saveBtn.disabled = true;


        try {

            showStatus(
                'Saving to Google Sheets...',
                'processing'
            );


            const response =
                await fetch(
                    APPS_SCRIPT_URL,
                    {

                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'text/plain;charset=utf-8'
                        },

                        body: JSON.stringify({

                            action: 'save',

                            records:
                                extractedResults

                        })

                    }
                );


            const text =
                await response.text();


            const data =
                JSON.parse(text);


            if (!data.success) {

                throw new Error(
                    data.error ||
                    'SAVE FAILED.'
                );

            }


            showStatus(
                'Saved ' +
                data.saved +
                ' record(s) to Google Sheets.',
                'success'
            );


        } catch (error) {

            console.error(error);


            showStatus(
                'SAVE ERROR: ' +
                error.message,
                'error'
            );


        } finally {

            saveBtn.disabled = false;

        }

    }
);


/* =========================================================
   COPY AUTOCOUNT LINES
   ========================================================= */

copyBtn.addEventListener(
    'click',
    async function() {

        if (
            extractedResults.length === 0
        ) {

            return;

        }


        const text =
            extractedResults

                .map(record => {

                    const line =
                        record.autocount ||
                        (
                            'BEING ' +
                            (
                                record.transactionType ||
                                'TRANSACTION'
                            ) +
                            ' OF ' +
                            (
                                record.item ||
                                ''
                            ) +
                            ' - ' +
                            (
                                record.company ||
                                ''
                            ) +
                            ' - ' +
                            (
                                record.date ||
                                ''
                            )
                        );


                    return (
                        line +
                        '    RM ' +
                        record.price
                    );

                })

                .join('\n');


        try {

            await navigator.clipboard.writeText(
                text
            );


            showStatus(
                'AutoCount lines copied.',
                'success'
            );

        } catch (error) {

            showStatus(
                'Unable to copy automatically.',
                'error'
            );

        }

    }
);


/* =========================================================
   DOWNLOAD CSV
   ========================================================= */

downloadBtn.addEventListener(
    'click',
    function() {

        if (
            extractedResults.length === 0
        ) {

            return;

        }


        const headers = [

            'DATE',

            'COMPANY',

            'ITEM',

            'PRICE',

            'AUTOCOUNT LINE',

            'RECEIPT FILENAME'

        ];


        const rows =
            extractedResults.map(
                record => [

                    record.date,

                    record.company,

                    record.item,

                    record.price,

                    record.autocount,

                    record.filename

                ]
            );


        const csv = [

            headers,

            ...rows

        ]

        .map(
            row =>
                row
                    .map(
                        value =>
                            '"' +
                            String(
                                value || ''
                            )
                            .replace(
                                /"/g,
                                '""'
                            ) +
                            '"'
                    )
                    .join(',')
        )

        .join('\n');


        const blob =
            new Blob(
                [csv],
                {
                    type:
                        'text/csv;charset=utf-8;'
                }
            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement('a');


        a.href = url;

        a.download =
            'receipt_extraction.csv';


        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);


        URL.revokeObjectURL(url);

    }
);


/* =========================================================
   CLEAR
   ========================================================= */

clearBtn.addEventListener(
    'click',
    function() {

        fileInput.value = '';

        extractedResults = [];

        resultsContainer.innerHTML = '';

        status.classList.add('hidden');

        saveBtn.disabled = true;

        copyBtn.disabled = true;

        downloadBtn.disabled = true;

    }
);

</script>


</body>

</html>
