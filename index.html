<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Receipt → AutoCount</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .upload-area {
      border: 2px dashed #aaa;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-area:hover {
      border-color: #333;
      background: #fafafa;
    }

    .upload-area input {
      display: none;
    }

    .upload-button {
      display: inline-block;
      padding: 12px 20px;
      background: #222;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .file-info {
      margin-top: 10px;
      color: #555;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary {
      background: #e9e9e9;
      color: #222;
    }

    .danger {
      background: #d9534f;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .controls {
      text-align: center;
      margin-top: 15px;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f1f1;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .progress {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
      text-align: center;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .result-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fff;
    }

    .result-card.failed {
      border-color: #d9534f;
      background: #fff5f5;
    }

    .result-number {
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .field {
      margin: 5px 0;
      word-break: break-word;
    }

    .field strong {
      display: inline-block;
      min-width: 145px;
    }

    .autocount {
      background: #f7f7f7;
      padding: 10px;
      border-radius: 7px;
      margin-top: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      background: #f4f4f4;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 22px;
      font-weight: bold;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 3px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 15px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .field strong {
        display: block;
        min-width: auto;
      }

      button {
        width: 100%;
        margin: 4px 0;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Receipt → AutoCount</h1>
  <div class="subtitle">
    Upload receipts and extract accounting information automatically
  </div>

  <div class="card">

    <div class="upload-area" id="uploadArea">
      <label for="fileInput">
        <span class="upload-button">Select Receipt Images</span>
      </label>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
      >

      <div class="file-info" id="fileInfo">
        No images selected
      </div>
    </div>

    <div class="controls">

      <button
        class="primary"
        id="extractBtn"
        onclick="startExtraction()"
        disabled
      >
        Extract Receipts
      </button>

      <button
        class="secondary"
        id="copyBtn"
        onclick="copyAutoCount()"
        disabled
      >
        Copy AutoCount
      </button>

      <button
        class="secondary"
        id="downloadBtn"
        onclick="downloadTXT()"
        disabled
      >
        Download TXT
      </button>

      <button
        class="secondary"
        id="csvBtn"
        onclick="downloadCSV()"
        disabled
      >
        Download CSV
      </button>

      <button
        class="secondary"
        id="saveBtn"
        onclick="saveToSheet()"
        disabled
      >
        Save to Google Sheet
      </button>

      <button
        class="danger"
        id="clearBtn"
        onclick="clearAll()"
      >
        Clear
      </button>

    </div>

    <div class="status" id="status">
      Ready.
    </div>

    <div class="progress" id="progress"></div>

  </div>


  <div class="card">

    <div class="results-header">
      <h2>Results</h2>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-number" id="selectedCount">0</div>
        <div class="stat-label">Selected</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="processedCount">0</div>
        <div class="stat-label">Processed</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="successCount">0</div>
        <div class="stat-label">Success</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="failedCount">0</div>
        <div class="stat-label">Failed</div>
      </div>

    </div>

    <div id="results"></div>

  </div>

</div>


<script>

  // ============================================================
  // CONFIGURATION
  // ============================================================

  const APPS_SCRIPT_URL=
    "https://script.google.com/macros/s/AKfycbxGYlLkkvFXLxtLTjJMn7DVpPLQR4QASmR7W9ZKlr150muzI5ywiNictWe15jrYohC9ww/exec";

  /*
    Keep batches small.

    5 receipts per Gemini request gives the API more breathing room
    than sending 10 images at once.
  */
  const BATCH_SIZE = 5;

  /*
    Images are resized before being sent to Apps Script.
  */
  const MAX_IMAGE_SIZE = 1200;

  /*
    JPEG quality.
  */
  const JPEG_QUALITY = 0.70;

  /*
    Frontend retry count.

    Apps Script ALSO has model-level retries.
    Keeping this at 2 prevents excessive duplicate requests.
  */
  const MAX_RETRIES = 2;

  /*
    Delay between batches.
  */
  const DELAY_BETWEEN_BATCHES = 5000;


  // ============================================================
  // GLOBAL VARIABLES
  // ============================================================

  let selectedFiles = [];
  let extractedResults = [];


  // ============================================================
  // ELEMENTS
  // ============================================================

  const fileInput = document.getElementById("fileInput");
  const fileInfo = document.getElementById("fileInfo");
  const uploadArea = document.getElementById("uploadArea");

  const extractBtn = document.getElementById("extractBtn");
  const copyBtn = document.getElementById("copyBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const csvBtn = document.getElementById("csvBtn");
  const saveBtn = document.getElementById("saveBtn");

  const statusEl = document.getElementById("status");
  const progressEl = document.getElementById("progress");
  const resultsEl = document.getElementById("results");

  const selectedCountEl = document.getElementById("selectedCount");
  const processedCountEl = document.getElementById("processedCount");
  const successCountEl = document.getElementById("successCount");
  const failedCountEl = document.getElementById("failedCount");


  // ============================================================
  // FILE SELECTION
  // ============================================================

  fileInput.addEventListener("change", function () {

    selectedFiles = Array.from(this.files);

    updateFileInfo();

    extractedResults = [];
    renderResults();

    updateButtons();

  });


  uploadArea.addEventListener("dragover", function (event) {
    event.preventDefault();
  });


  uploadArea.addEventListener("drop", function (event) {

    event.preventDefault();

    selectedFiles = Array.from(event.dataTransfer.files)
      .filter(file => file.type.startsWith("image/"));

    updateFileInfo();

    extractedResults = [];
    renderResults();

    updateButtons();

  });


  function updateFileInfo() {

    if (selectedFiles.length === 0) {

      fileInfo.textContent = "No images selected";

    } else {

      fileInfo.textContent =
        selectedFiles.length +
        " image" +
        (selectedFiles.length === 1 ? "" : "s") +
        " selected";

    }

    selectedCountEl.textContent = selectedFiles.length;
  }


  // ============================================================
  // IMAGE COMPRESSION
  // ============================================================

  function compressImage(file) {

    return new Promise((resolve, reject) => {

      const reader = new FileReader();

      reader.onload = function () {

        const img = new Image();

        img.onload = function () {

          let width = img.width;
          let height = img.height;

          /*
            Resize while maintaining aspect ratio.
          */

          if (width > MAX_IMAGE_SIZE || height > MAX_IMAGE_SIZE) {

            if (width > height) {

              height =
                Math.round(
                  height * MAX_IMAGE_SIZE / width
                );

              width = MAX_IMAGE_SIZE;

            } else {

              width =
                Math.round(
                  width * MAX_IMAGE_SIZE / height
                );

              height = MAX_IMAGE_SIZE;
            }
          }

          const canvas = document.createElement("canvas");

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d");

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          const dataUrl =
            canvas.toDataURL(
              "image/jpeg",
              JPEG_QUALITY
            );

          resolve({
            mimeType: "image/jpeg",
            base64: dataUrl.split(",")[1],
            originalName: file.name
          });

        };

        img.onerror = reject;

        img.src = reader.result;

      };

      reader.onerror = reject;

      reader.readAsDataURL(file);

    });

  }


  // ============================================================
  // DELAY
  // ============================================================

  function sleep(ms) {

    return new Promise(resolve => {
      setTimeout(resolve, ms);
    });

  }


  // ============================================================
  // SEND BATCH
  // ============================================================

  async function sendBatch(batch, batchNumber, totalBatches) {

    let lastError = null;

    for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {

      try {

        statusEl.textContent =
          "Sending batch " +
          batchNumber +
          " of " +
          totalBatches +
          "...\n" +
          "Attempt " +
          attempt +
          " of " +
          MAX_RETRIES;

        const response = await fetch(
          APPS_SCRIPT_URL,
          {
            method: "POST",

            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },

            body: JSON.stringify({
              action: "extract",
              images: batch
            })
          }
        );


        const text = await response.text();

        let data;

        try {

          data = JSON.parse(text);

        } catch (parseError) {

          throw new Error(
            "Invalid response from Apps Script: " +
            text.substring(0, 500)
          );

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Apps Script HTTP " + response.status
          );

        }


        if (!data || !Array.isArray(data)) {

          if (data && data.error) {
            throw new Error(data.error);
          }

          throw new Error(
            "Unexpected response from Apps Script."
          );

        }


        return data;

      } catch (error) {

        lastError = error;

        console.error(
          "Batch attempt failed:",
          error
        );

        if (attempt < MAX_RETRIES) {

          await sleep(3000 * attempt);

        }

      }

    }

    throw lastError;

  }


  // ============================================================
  // START EXTRACTION
  // ============================================================

  async function startExtraction() {

    if (selectedFiles.length === 0) {

      alert("Please select receipt images first.");

      return;
    }


    if (
      !APPS_SCRIPT_URL ||
      APPS_SCRIPT_URL.includes("PASTE_YOUR")
    ) {

      alert(
        "Please put your Apps Script Web App URL into APPS_SCRIPT_URL first."
      );

      return;
    }


    extractBtn.disabled = true;
    copyBtn.disabled = true;
    downloadBtn.disabled = true;
    csvBtn.disabled = true;
    saveBtn.disabled = true;

    extractedResults = [];

    renderResults();


    try {

      statusEl.textContent =
        "Compressing images...";

      const compressedImages = [];


      for (
        let i = 0;
        i < selectedFiles.length;
        i++
      ) {

        progressEl.textContent =
          "Preparing image " +
          (i + 1) +
          " of " +
          selectedFiles.length;

        const compressed =
          await compressImage(selectedFiles[i]);

        compressedImages.push(compressed);

      }


      const batches = [];

      for (
        let i = 0;
        i < compressedImages.length;
        i += BATCH_SIZE
      ) {

        batches.push(
          compressedImages.slice(
            i,
            i + BATCH_SIZE
          )
        );

      }


      let processed = 0;
      let successful = 0;
      let failed = 0;


      for (
        let i = 0;
        i < batches.length;
        i++
      ) {

        const batch = batches[i];

        progressEl.textContent =
          "Processing batch " +
          (i + 1) +
          " of " +
          batches.length;


        try {

          const results =
            await sendBatch(
              batch,
              i + 1,
              batches.length
            );


          results.forEach(result => {

            if (result.success === false) {

              failed++;

            } else {

              successful++;

            }

            extractedResults.push(result);

          });


          processed += batch.length;


        } catch (error) {

          console.error(
            "Batch completely failed:",
            error
          );


          /*
            Preserve one failure result per receipt.
          */

          batch.forEach((image, index) => {

            extractedResults.push({

              success: false,

              company: "UNKNOWN",

              item: "UNKNOWN",

              date: "UNKNOWN",

              price: "UNKNOWN",

              transactionType: "OTHER",

              autocount:
                "ERROR - " +
                image.originalName,

              error:
                error.message ||
                "Extraction failed.",

              fileName:
                image.originalName

            });

            failed++;

          });

          processed += batch.length;

        }


        processedCountEl.textContent = processed;
        successCountEl.textContent = successful;
        failedCountEl.textContent = failed;


        renderResults();


        /*
          Delay between batches.

          Do not delay after the final batch.
        */

        if (i < batches.length - 1) {

          statusEl.textContent =
            "Batch " +
            (i + 1) +
            " completed.\n" +
            "Waiting before next batch...";

          await sleep(
            DELAY_BETWEEN_BATCHES
          );

        }

      }


      statusEl.textContent =
        "Extraction completed.\n" +
        "Processed: " + processed +
        "\nSuccess: " + successful +
        "\nFailed: " + failed;


      progressEl.textContent =
        "Finished.";

      updateButtons();


    } catch (error) {

      console.error(error);

      statusEl.textContent =
        "ERROR: " +
        (error.message || error);

      progressEl.textContent =
        "Extraction stopped.";

    } finally {

      extractBtn.disabled = false;

    }

  }


  // ============================================================
  // RENDER RESULTS
  // ============================================================

  function renderResults() {

    resultsEl.innerHTML = "";

    extractedResults.forEach((result, index) => {

      const card =
        document.createElement("div");

      card.className =
        "result-card" +
        (
          result.success === false
            ? " failed"
            : ""
        );


      const number =
        document.createElement("div");

      number.className =
        "result-number";

      number.textContent =
        "Receipt " + (index + 1);


      card.appendChild(number);


      addField(
        card,
        "Company",
        result.company
      );

      addField(
        card,
        "Item",
        result.item
      );

      addField(
        card,
        "Date",
        result.date
      );

      addField(
        card,
        "Price",
        result.price
      );

      addField(
        card,
        "Transaction Type",
        result.transactionType
      );


      const autoLabel =
        document.createElement("div");

      autoLabel.className = "field";

      autoLabel.innerHTML =
        "<strong>AutoCount:</strong>";


      card.appendChild(autoLabel);


      const auto =
        document.createElement("div");

      auto.className =
        "autocount";

      auto.textContent =
        result.autocount || "UNKNOWN";


      card.appendChild(auto);


      if (result.modelUsed) {

        addField(
          card,
          "Model Used",
          result.modelUsed
        );

      }


      if (result.error) {

        addField(
          card,
          "Error",
          result.error
        );

      }


      resultsEl.appendChild(card);

    });

  }


  function addField(
    parent,
    label,
    value
  ) {

    const div =
      document.createElement("div");

    div.className = "field";

    const strong =
      document.createElement("strong");

    strong.textContent =
      label + ":";

    div.appendChild(strong);

    div.appendChild(
      document.createTextNode(
        " " +
        (
          value === undefined ||
          value === null ||
          value === ""
            ? "UNKNOWN"
            : value
        )
      )
    );

    parent.appendChild(div);

  }


  // ============================================================
  // COPY AUTOCOUNT
  // ============================================================

  async function copyAutoCount() {

    if (extractedResults.length === 0) {
      return;
    }


    const lines =
      extractedResults
        .filter(r => r.success !== false)
        .map(r => r.autocount || "UNKNOWN");


    if (lines.length === 0) {

      alert("No successful results to copy.");

      return;

    }


    const text =
      lines.join("\n");


    try {

      await navigator.clipboard.writeText(text);

      statusEl.textContent =
        "AutoCount text copied.";

    } catch (error) {

      /*
        Fallback for browsers that block
        navigator.clipboard.
      */

      const textarea =
        document.createElement("textarea");

      textarea.value = text;

      document.body.appendChild(textarea);

      textarea.select();

      document.execCommand("copy");

      textarea.remove();

      statusEl.textContent =
        "AutoCount text copied.";

    }

  }


  // ============================================================
  // DOWNLOAD TXT
  // ============================================================

  function downloadTXT() {

    const lines =
      extractedResults
        .filter(r => r.success !== false)
        .map(r => r.autocount || "UNKNOWN");


    if (lines.length === 0) {

      alert("No successful results.");

      return;

    }


    const blob =
      new Blob(
        [lines.join("\n")],
        {
          type: "text/plain;charset=utf-8"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "autocount_output.txt";

    a.click();


    URL.revokeObjectURL(url);

  }


  // ============================================================
  // CSV DOWNLOAD
  // ============================================================

  function csvEscape(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    value =
      String(value);

    return '"' +
      value.replace(
        /"/g,
        '""'
      ) +
      '"';

  }


  function downloadCSV() {

    if (extractedResults.length === 0) {

      alert("No results.");

      return;

    }


    const header = [
      "Company",
      "Item",
      "Date",
      "Price",
      "Transaction Type",
      "AutoCount",
      "Model Used",
      "Status"
    ];


    const rows =
      extractedResults.map(r => [

        r.company,

        r.item,

        r.date,

        r.price,

        r.transactionType,

        r.autocount,

        r.modelUsed || "",

        r.success === false
          ? "FAILED"
          : "SUCCESS"

      ]);


    const csv = [

      header.map(csvEscape).join(","),

      ...rows.map(
        row =>
          row.map(csvEscape).join(",")
      )

    ].join("\n");


    const blob =
      new Blob(
        [csv],
        {
          type: "text/csv;charset=utf-8"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "receipt_extraction.csv";

    a.click();


    URL.revokeObjectURL(url);

  }


  // ============================================================
  // SAVE TO GOOGLE SHEET
  // ============================================================

  async function saveToSheet() {

    if (extractedResults.length === 0) {

      alert("No results to save.");

      return;

    }


    const successfulResults =
      extractedResults.filter(
        r => r.success !== false
      );


    if (successfulResults.length === 0) {

      alert(
        "There are no successful results to save."
      );

      return;

    }


    saveBtn.disabled = true;

    statusEl.textContent =
      "Saving to Google Sheet...";


    try {

      const response =
        await fetch(
          APPS_SCRIPT_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action: "save",

              results:
                successfulResults

            })

          }
        );


      const text =
        await response.text();


      let data;

      try {

        data =
          JSON.parse(text);

      } catch {

        throw new Error(
          "Invalid response from Apps Script."
        );

      }


      if (!response.ok || data.success === false) {

        throw new Error(
          data.error ||
          "Failed to save."
        );

      }


      statusEl.textContent =
        "Saved " +
        successfulResults.length +
        " receipt(s) to Google Sheet.";


    } catch (error) {

      console.error(error);

      statusEl.textContent =
        "SAVE ERROR: " +
        error.message;

    } finally {

      saveBtn.disabled = false;

    }

  }


  // ============================================================
  // CLEAR
  // ============================================================

  function clearAll() {

    selectedFiles = [];

    extractedResults = [];

    fileInput.value = "";

    fileInfo.textContent =
      "No images selected";

    statusEl.textContent =
      "Ready.";

    progressEl.textContent =
      "";

    renderResults();

    updateFileInfo();

    updateButtons();

  }


  // ============================================================
  // BUTTON STATE
  // ============================================================

  function updateButtons() {

    extractBtn.disabled =
      selectedFiles.length === 0;

    const hasResults =
      extractedResults.length > 0;

    copyBtn.disabled =
      !hasResults;

    downloadBtn.disabled =
      !hasResults;

    csvBtn.disabled =
      !hasResults;

    saveBtn.disabled =
      !hasResults;

  }


  // ============================================================
  // INITIAL STATE
  // ============================================================

  updateFileInfo();
  updateButtons();

</script>

</body>
</html>
